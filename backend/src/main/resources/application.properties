# ==========================================
# Superset Pro: JECRC University Unified Platform
# Application Configuration
# ==========================================

spring.application.name=Superset Pro
server.port=${PORT:8080}
server.address=0.0.0.0

# ------------------------------------------
# Database Configuration
# Default: H2 in PostgreSQL compatibility mode
# (Seamlessly overridden via SPRING_DATASOURCE_URL in Docker / Production)
# ------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/youcan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ------------------------------------------
# JPA & Hibernate
# ------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ------------------------------------------
# Flyway Database Migration
# ------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ------------------------------------------
# H2 Console (Developer access)
# ------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------
# Thymeleaf & Web
# ------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------
# File Uploads (Resumes, CSV, Excel)
# ------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/resumes

# ------------------------------------------
# Security & University Domain Validation
# ------------------------------------------
app.security.allowed-domains=jecrcu.edu.in,university.edu
app.security.require-email-verification=false
app.university.name=JECRC University
app.university.short-name=JECRC

# ------------------------------------------
# Mail Configuration (Mock/Console by default)
# ------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@jecrcu.edu.in}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
management.health.mail.enabled=false
management.endpoint.health.show-details=always

# ------------------------------------------
# AI Feature Configuration (Google Gemini Cloud LLM)
# ------------------------------------------
app.ai.enabled=${APP_AI_ENABLED:true}
app.ai.api-key=${GEMINI_API_KEY:${APP_AI_API_KEY:}}
app.ai.model=${APP_AI_MODEL:gemini-1.5-flash}
app.ai.temperature=${APP_AI_TEMPERATURE:0.2}
app.ai.max-tokens=${APP_AI_MAX_TOKENS:1000}

# ------------------------------------------
# React Frontend CORS (Cross-Origin) Configuration
# Set to the React dev server or Vercel domain if accessing across origins.
# ------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${REACT_CORS_ORIGINS:}}

# ------------------------------------------
# Reverse Proxy & Session Cookie Configuration (Vercel / Cloud Gateway)
# ------------------------------------------
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ------------------------------------------
# Academic Attendance Configuration
# Configurable percentage threshold and excusal policy
# ------------------------------------------
app.attendance.minimum-percentage=${ATTENDANCE_MIN_PERCENTAGE:75.0}
app.attendance.include-approved-leave=${ATTENDANCE_INCLUDE_LEAVE:true}
app.attendance.include-official-duty=${ATTENDANCE_INCLUDE_DUTY:true}
